<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Birthday Quest 02</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #0b0b0f;
      color: white;

      font-family: Arial, sans-serif;
    }

    .quest-box {
      width: 90%;
      max-width: 500px;

      padding: 40px 30px;

      border: 1px solid #333;
      border-radius: 20px;

      background: #15151c;

      text-align: center;
    }

    .quest-number {
      color: #888;

      font-size: 14px;
      letter-spacing: 3px;

      margin-bottom: 15px;
    }

    .lock {
      font-size: 55px;
      margin: 20px 0;
    }

    h1 {
      font-size: 32px;
      margin-top: 0;
    }

    .description {
      color: #aaa;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .encrypted {
      margin: 25px 0;

      padding: 20px;

      border: 1px solid #444;
      border-radius: 12px;

      background: #0d0d12;

      font-size: 28px;
      letter-spacing: 5px;
    }

    .hint-text {
      margin: 20px 0 30px;

      color: #bbb;
      line-height: 1.8;
    }

    input {
      width: 100%;

      padding: 15px;

      border: 1px solid #444;
      border-radius: 10px;

      background: #0d0d12;
      color: white;

      font-size: 19px;
      text-align: center;

      outline: none;
    }

    button {
      width: 100%;

      margin-top: 12px;
      padding: 15px;

      border: none;
      border-radius: 10px;

      background: white;
      color: black;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    #message {
      min-height: 25px;
      margin-top: 20px;
    }

    .success {
      color: #71ff9d;
    }

    .fail {
      color: #ff6b6b;
    }

    #location {
      display: none;

      margin-top: 30px;
      padding: 22px;

      border: 1px solid #71ff9d;
      border-radius: 12px;

      line-height: 1.8;
    }

    .location-name {
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="quest-box">

    <div class="quest-number">
      BIRTHDAY QUEST // 02
    </div>

    <div class="lock" id="lock">
      🔒
    </div>

    <h1>QUEST 02</h1>

    <div class="description">
      다음 목적지는 암호화되어 있다.<br>
      단서를 이용해 물건을 찾아내라.
    </div>

    <div class="encrypted">
      ㅇㅇㅍㄹㅇㅇ
    </div>

    <div class="hint-text">
      🌡️ 180°C<br>
      ⏱️ 15 MIN
    </div>

    <input
      type="text"
      id="answer"
      placeholder="물건 입력"
      autocomplete="off"
    >

    <button onclick="checkAnswer()">
      DECRYPT
    </button>

    <div id="message"></div>

    <div id="location">

      <b>LOCATION DECRYPTED</b>

      <br><br>

      <div class="location-name">
        에어프라이어
      </div>

      <br>

      안을 열 필요는 없다.

      <br>

      <b>뒤를 확인해라.</b>

    </div>

  </div>


  <script>

    function checkAnswer() {

      const answer =
        document.getElementById("answer").value
        .trim()
        .replaceAll(" ", "");

      const message =
        document.getElementById("message");

      const location =
        document.getElementById("location");

      const lock =
        document.getElementById("lock");


      if (
        answer === "에어프라이어" ||
        answer === "airfryer"
      ) {

        lock.textContent = "🔓";

        message.textContent =
          "ACCESS GRANTED";

        message.className =
          "success";

        location.style.display =
          "block";

      }

      else {

        message.textContent =
          "ACCESS DENIED — 다시 시도해라.";

        message.className =
          "fail";

      }

    }


    document
      .getElementById("answer")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          checkAnswer();
        }

      });

  </script>

</body>
</html>
